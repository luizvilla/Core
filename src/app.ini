# Do not edit or remove the following line
[env]

board_shield = uSolarVerter
board_shield_version = 0_9_0

lib_deps=
    control_library = https://github.com/luizvilla/control_library.git#d1449a4d9c0842dd3289b4e3e75f6196834bc9b7
    owntech_examples = https://github.com/owntech-foundation/examples.git
    scope = https://github.com/owntech-foundation/scopemimicry.git
    single_phase_inverter = https://github.com/luizvilla/single_phase_inverter.git#1db5b895444ba903f0397f3eb2e5503068cbbe98

# L0-TIM on-target timing tests (ADR 0005, tests/l0/timing/README.md). Same image as USB plus the
# TIMING_HARNESS flag: main.cpp runs the timing scenario instead of the tasks (no PWM is started).
# Flashed through an ST-Link with PlatformIO's OpenOCD into the MCUboot slot; the bootloader already on the
# board is kept. Do not use this firmware on the bench.
[env:TIMING]
extends = bootloader
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=TIMING
build_flags =
    ${env.build_flags}
    -DTIMING_HARNESS
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -f target/stm32g4x.cfg -c "program $SOURCE 0x8047800 verify reset exit"
extra_scripts =
    pre:owntech/scripts/pre_bootloader_common.py
    pre:owntech/scripts/pre_usb.py
    pre:owntech/scripts/pre_version.py

# Reference build for L0-TIM before/after comparisons: as TIMING, but the flash wait states the Zephyr clock
# driver sets (8 at 170 MHz), i.e. without the RM0440 correction of the Spin API (worklog 2026-11-12).
# run.sh --flash-ws8 marks its campaign as a reference: it never becomes a test's current result.
[env:TIMING_WS8]
extends = env:TIMING
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=TIMING_WS8
build_flags =
    ${env.build_flags}
    -DTIMING_HARNESS
    -DTIMING_FLASH_WS_HAL
