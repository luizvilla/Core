# Do not edit or remove the following line
[env]

board_shield = twist
board_shield_version = 1_4_2

build_src_filter =
    +<main.cpp>
    -<main_*.cpp>

lib_deps=
    control_library = https://github.com/owntech-foundation/control_library.git
    owntech_examples = https://github.com/luizvilla/examples.git#test_multi_sensor
    scope = https://github.com/owntech-foundation/scopemimicry.git
    single_phase_inverter = https://github.com/owntech-foundation/single_phase_inverter.git 

[env:USB_open_loop]
extends = env:USB
build_src_filter =
    +<main_open_loop.cpp>
    -<main.cpp>
    -<main_grid_forming.cpp>
    -<main_grid_following.cpp>

[env:USB_grid_forming]
extends = env:USB
build_src_filter =
    +<main_grid_forming.cpp>
    -<main.cpp>
    -<main_open_loop.cpp>
    -<main_grid_following.cpp>

[env:USB_grid_following]
extends = env:USB
build_src_filter =
    +<main_grid_following.cpp>
    -<main.cpp>
    -<main_open_loop.cpp>
    -<main_grid_forming.cpp>
