# Development build (issue #27): run-time self-tests off, only allowed in development mode
CONFIG_OWNTECH_SAFETY_RUNTIME_SELFTEST=n

# Bare Spin: the floating current pins never change, so the frozen-sensor check (2000 periods) would fire in a few
# hundred ms. 100000 periods (5 s at 50 us) keeps it running, at its usual per-period cost, without firing in the 4 s window.
CONFIG_OWNTECH_SAFETY_FROZEN_PERIODS=100000
