# Fault injection hooks for the self-test cases (L0-STK, ADR 0009, #21)
CONFIG_OWNTECH_SAFETY_TEST_HOOKS=y
# Cases follow each other within seconds, each ending in a clear: a 100 ms repeat-clear window so the next
# case's fault is not "within the window of a clear" (ADR 0009 reading B; 10 s in production).
CONFIG_OWNTECH_SAFETY_REPEAT_CLEAR_MS=100
