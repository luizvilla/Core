# Generic safety test firmware (ADR 0009, #23): ThingSet over the USB shell, as SPOC's Core-CUT.
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_CMDS_SELECT=y
CONFIG_THINGSET=y
CONFIG_THINGSET_SDK=y
CONFIG_THINGSET_SHELL=y
CONFIG_THINGSET_SHELL_REPORTING=n
CONFIG_THINGSET_SHELL_CMD_BUF_SIZE=256
CONFIG_THINGSET_CAN=y
CONFIG_LOG=n
CONFIG_SHELL_LOG_BACKEND=n
# Repeat-clear window short enough for back-to-back test cases (ADR 0009)
CONFIG_OWNTECH_SAFETY_REPEAT_CLEAR_MS=100
# Fault-injection accessors for the C10 cases (safety_trips_test_regs)
CONFIG_OWNTECH_SAFETY_TEST_HOOKS=y
