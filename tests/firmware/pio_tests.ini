# Test firmware environments (not for power boards on a bench).
#
# SAFETY_SUP: CPU-supervision test firmware (ADR 0009, issue #16), driven over
# SWD by tests/l0/safety_supervision/run.py on a bare Spin. Builds the app in
# tests/firmware/safety_supervision instead of src/ (build_src_filter for the
# sources, OWNTECH_APP_DIR for app.conf and app.overlay). Flashed
# through an ST-Link with PlatformIO's OpenOCD into the MCUboot slot; the
# bootloader already on the board is kept.
[env:SAFETY_SUP]
extends = bootloader
# No shield: CPU supervision does not depend on one, and a bare Spin then has
# no hardware trip to arm (tools/restore_board_lines.py restores the SHIELD line).
board_shield =
board_shield_version =
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=SAFETY_SUP -DOWNTECH_APP_DIR=tests/firmware/safety_supervision
# PlatformIO compiles the application itself (not the CMake app target): take
# the sources from the test folder instead of src/.
build_src_filter = -<*> +<../tests/firmware/safety_supervision/>
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -f target/stm32g4x.cfg -c "program $SOURCE 0x8047800 verify reset exit"
extra_scripts =
    pre:owntech/scripts/pre_bootloader_common.py
    pre:owntech/scripts/pre_usb.py
    pre:owntech/scripts/pre_version.py

# SAFETY_CHECK: devicetree and protection allocation only, for any shield
# (tools/safety_check.py, tests/l0/safety_allocation). The shield and an
# optional draft overlay come from the environment:
#   SAFETY_SHIELD=twist SAFETY_SHIELD_VERSION=1_4_2 [SAFETY_DRAFT=/abs/draft.overlay]
[env:SAFETY_CHECK]
extends = bootloader
board_shield = ${sysenv.SAFETY_SHIELD}
board_shield_version = ${sysenv.SAFETY_SHIELD_VERSION}
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=SAFETY_CHECK -DOWNTECH_APP_DIR=tests/firmware/safety_supervision ${sysenv.SAFETY_CHECK_ARGS}
build_src_filter = -<*> +<../tests/firmware/safety_supervision/>
extra_scripts =
    pre:owntech/scripts/pre_bootloader_common.py
    pre:owntech/scripts/pre_usb.py
    pre:owntech/scripts/pre_version.py

# SAFETY_COMP: comparator-path test firmware (ADR 0009, issue #18), driven over
# SWD by tests/l0/safety_comparator/run.py on a bare Spin with the Twist 1.4.1
# devicetree (I1_LOW on COMP1, I2_LOW on COMP3).
[env:SAFETY_COMP]
extends = bootloader
board_shield = twist
board_shield_version = 1_4_1
board_build.zephyr.cmake_extra_args = -DBUILD_ENV_NAME=SAFETY_COMP -DOWNTECH_APP_DIR=tests/firmware/safety_comparator
build_src_filter = -<*> +<../tests/firmware/safety_comparator/>
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -f target/stm32g4x.cfg -c "program $SOURCE 0x8047800 verify reset exit"
extra_scripts =
    pre:owntech/scripts/pre_bootloader_common.py
    pre:owntech/scripts/pre_usb.py
    pre:owntech/scripts/pre_version.py
